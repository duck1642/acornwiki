# Keep direct runtime dependencies aligned with requirements.txt.
[project]
name = "acornwiki"
version = "0.1.0"
description = "A modular personal knowledge workspace."
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["pywebview==6.2.1", "watchdog==7.1.0"]
license = "MIT"

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"
reportUnknownArgumentType = "warning"
reportUnknownLambdaType = "warning"
reportUnknownMemberType = "warning"
reportUnknownParameterType = "warning"
reportUnknownVariableType = "warning"
include = ["backend", "tests", "start.py"]
exclude = [
    "**/.git",
    "**/.venv",
    "**/__pycache__",
    "**/node_modules",
    "docs",
    "frontend",
    "tmp",
]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
